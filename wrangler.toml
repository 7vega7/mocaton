name = "tonstake-airdrop"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
MINI_APP_URL = "https://tonstake-airdrop.pages.dev"

# Cron trigger untuk proses withdraw otomatis setiap menit
# Uncomment setelah deploy pertama:
# [[triggers.crons]]
# cron = "* * * * *"

# Environment variables sensitif di-set via dashboard Cloudflare:
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_ADMIN_IDS
# TON_CONTRACT_ADDRESS
# TON_ADMIN_MNEMONIC
# TON_RPC_URL
# TON_API_KEY
